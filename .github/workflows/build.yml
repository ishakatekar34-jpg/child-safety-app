              private void connectParentWebSocket() {
                  try {
                      wsClient = new WebSocketClient(new URI(SERVER_WS)) {
                          @Override
                          public void onOpen(ServerHandshake handshakedata) {
                              try {
                                  JSONObject reg = new JSONObject();
                                  reg.put("type", "register");
                                  reg.put("familyCode", prefs.getString("family_code", "family"));
                                  reg.put("role", "PARENT");
                                  send(reg.toString());
                                  runOnUiThread(() -> statusText.setText("सर्व्हरशी जोडले गेले. मुलगा " + selectedChild + " ची माहिती वाट पाहत आहे..."));
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onMessage(String message) {
                              try {
                                  JSONObject obj = new JSONObject(message);
                                  if ("status".equals(obj.optString("type"))) {
                                      String state = obj.optString("message", "");
                                      runOnUiThread(() -> statusText.setText(state));
                                      return;
                                  }
                                  String fromChildId = obj.optString("fromChildId", "");
                                  if (!fromChildId.isEmpty() && !fromChildId.equals(selectedChild)) return;
                                  if (obj.has("data")) {
                                      Object rawData = obj.get("data");
                                      JSONObject data = rawData instanceof JSONObject ? (JSONObject) rawData : new JSONObject(String.valueOf(rawData));

                                      if (data.has("lat")) {
                                          currentLat = data.getDouble("lat");
                                          currentLng = data.getDouble("lng");
                                          boolean isStop = data.optBoolean("isStop", false);
                                          long dur = data.optLong("duration", 0);
                                          String alert = data.optString("alert", "");

                                          routePoints.add("[" + currentLat + "," + currentLng + "]");
                                          // Keep bounded route and stop history locally per child across app restarts.
                                          if (routePoints.size() > 1000) routePoints.remove(0);
                                          if (isStop && !previousStopState) {
                                              stopPoints.add("[" + currentLat + "," + currentLng + "," + dur + "," + System.currentTimeMillis() + "]");
                                              if (stopPoints.size() > 300) stopPoints.remove(0);
                                          }
                                          previousStopState = isStop;
                                          try {
                                              org.json.JSONArray saved = new org.json.JSONArray();
                                              for (String point : routePoints) saved.put(point);
                                              org.json.JSONArray savedStops = new org.json.JSONArray();
                                              for (String point : stopPoints) savedStops.put(new org.json.JSONArray(point));
                                              prefs.edit().putString("route_history_" + selectedChild, saved.toString())
                                                  .putString("route_stops_" + selectedChild, savedStops.toString()).apply();
                                          } catch (Exception ignored) {}

                                          runOnUiThread(() -> {
                                              statusText.setText("👦 मुलगा " + selectedChild + " चे लोकेशन:\nअक्षांश: " + currentLat + ", रेखांश: " + currentLng + (isStop ? "\n🛑 थांबा: " + dur + " मिनिटे" : ""));
                                              if (!alert.isEmpty()) alertText.setText("🚨 " + alert);
                                              loadMapWithRoute(currentLat, currentLng, isStop, dur);
                                          });
                                      }

                                      if (data.has("usageSummary")) {
                                          String usageSummary = data.optString("usageSummary", "");
                                          runOnUiThread(() -> usageText.setText("📊 App Usage Duration\n" + usageSummary));
                                      }
                                      if (data.has("featureStatus")) {
                                          String featureStatus = data.optString("featureStatus", "");
                                          runOnUiThread(() -> statusText.setText(featureStatus));
                                      }

                                      if (data.has("cameraImage")) {
                                          byte[] decoded = Base64.decode(data.getString("cameraImage"), Base64.DEFAULT);
                                          latestCameraBitmap = BitmapFactory.decodeByteArray(decoded, 0, decoded.length);
                                          runOnUiThread(() -> cameraFeedView.setImageBitmap(latestCameraBitmap));
                                      }
                                  }
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onClose(int code, String reason, boolean remote) {}
                          @Override
                          public void onError(Exception ex) {}
                      };
                      wsClient.connect();
                  } catch (Exception e) {}
              }

              private void showGeofenceDialog() {
                  LinearLayout fields = new LinearLayout(this);
                  fields.setOrientation(LinearLayout.VERTICAL);
                  EditText lat = new EditText(this); lat.setHint("Safe latitude (उदा. 18.501)"); lat.setInputType(8194);
                  EditText lng = new EditText(this); lng.setHint("Safe longitude (उदा. 73.863)"); lng.setInputType(8194);
                  EditText radius = new EditText(this); radius.setHint("Radius metres (उदा. 500)"); radius.setInputType(2); radius.setText("500");
                  fields.addView(lat); fields.addView(lng); fields.addView(radius);
                  new android.app.AlertDialog.Builder(this).setTitle("Geofence सेटिंग्ज")
                      .setMessage("सुरक्षित ठिकाणाचे coordinates भरा. मुलाच्या फोनवर GPS सेवा चालू असणे आवश्यक आहे.")
                      .setView(fields).setNegativeButton("रद्द", null)
                      .setPositiveButton("सेव्ह व पाठवा", (d, which) -> {
                          try {
                              double la = Double.parseDouble(lat.getText().toString().trim());
                              double lo = Double.parseDouble(lng.getText().toString().trim());
                              int r = Integer.parseInt(radius.getText().toString().trim());
                              if (la < -90 || la > 90 || lo < -180 || lo > 180 || r < 50 || r > 50000) throw new IllegalArgumentException();
                              if (wsClient == null || !wsClient.isOpen()) { Toast.makeText(this, "सर्व्हर जोडलेला नाही.", Toast.LENGTH_LONG).show(); return; }
                              JSONObject c = new JSONObject(); c.put("type", "command"); c.put("targetChildId", selectedChild); c.put("command", "SET_GEOFENCE"); c.put("latitude", la); c.put("longitude", lo); c.put("radius", r); wsClient.send(c.toString());
                              Toast.makeText(this, "Geofence सेटिंग्ज मुलाच्या फोनला पाठवल्या.", Toast.LENGTH_LONG).show();
                          } catch (Exception e) { Toast.makeText(this, "Latitude/Longitude आणि 50–50000m radius योग्य भरा.", Toast.LENGTH_LONG).show(); }
                      }).show();
              }

              private void sendCommand(String cmd) {
                  if (wsClient != null && wsClient.isOpen()) {
                      try {
                          JSONObject c = new JSONObject();
                          c.put("type", "command");
                          c.put("targetChildId", selectedChild);
                          c.put("command", cmd);
                          wsClient.send(c.toString());
                          Toast.makeText(this, "आदेश पाठवला!", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {}
                  }
              }

              private void saveCurrentPhotoToGallery() {
                  if (latestCameraBitmap == null) {
                      Toast.makeText(this, "अजून कोणताही कॅमेरा फोटो आलेला नाही!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      String title = "Child_" + selectedChild + "_" + System.currentTimeMillis();
                      MediaStore.Images.Media.insertImage(getContentResolver(), latestCameraBitmap, title, "Family Safety Capture");
                      Toast.makeText(this, "फोटो तुमच्या मोबाईलच्या गॅलरीत सेव्ह झाला!", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "फोटो सेव्ह करताना अडचण आली!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void loadMapWithRoute(double lat, double lng, boolean isStop, long duration) {
                  StringBuilder poly = new StringBuilder("[");
                  for (int i = 0; i < routePoints.size(); i++) {
                      poly.append(routePoints.get(i));
                      if (i < routePoints.size() - 1) poly.append(",");
                  }
                  poly.append("]");

                  StringBuilder stops = new StringBuilder("[");
                  for (int i = 0; i < stopPoints.size(); i++) {
                      stops.append(stopPoints.get(i));
                      if (i < stopPoints.size() - 1) stops.append(",");
                  }
                  stops.append("]");
                  String currentStopMarker = isStop ? "L.circleMarker([" + lat + "," + lng + "], {color: 'red', radius: 12}).addTo(map).bindPopup('🛑 सध्याचा थांबा: " + duration + " मिनिटे').openPopup();" : "";
                  String html = "<html><head><meta name='viewport' content='width=device-width, initial-scale=1'/><link rel='stylesheet' href='https://unpkg.com/leaflet/dist/leaflet.css'/><script src='https://unpkg.com/leaflet/dist/leaflet.js'></script></head><body style='margin:0;padding:0;'><div id='map' style='width:100%;height:100vh;'></div><script>var map=L.map('map').setView([" + lat + "," + lng + "],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);var path = " + poly.toString() + "; if(path.length > 1) { L.polyline(path, {color: 'blue', weight: 5}).addTo(map); } var stops = " + stops.toString() + "; for(var i=0;i<stops.length;i++){ L.circleMarker([stops[i][0],stops[i][1]], {color:'red',radius:8}).addTo(map).bindPopup('🛑 थांबा: '+stops[i][2]+' मिनिटे'); } L.marker([" + lat + "," + lng + "]).addTo(map).bindPopup('मुलगा " + selectedChild + "').openPopup();" + currentStopMarker + "</script></body></html>";
                  mapWebView.loadData(html, "text/html", "UTF-8");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (wsClient != null) wsClient.close();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilySafety360-Master-Private-APK
          path: app/build/outputs/apk/debug/*.apk
