              private void startTrackingService() {
                  Intent intent = new Intent(this, LocationService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent);
                  else startService(intent);
                  Toast.makeText(this, "ट्रॅकिंग सेवा सुरू करण्याची विनंती केली.", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 102) {
                      boolean cameraGranted = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                      prefs.edit().putBoolean("camera_permission_granted", cameraGranted).apply();
                      Toast.makeText(this, cameraGranted ? "Camera permission मिळाली. आता Remote Camera Session सुरू करा." : "Camera permission नाकारली; camera feature बंद.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (requestCode == 101) {
                      boolean locationGranted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      boolean cameraGranted = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                      prefs.edit().putBoolean("camera_permission_granted", cameraGranted).apply();
                      if (locationGranted) {
                          startTrackingService();
                          if (!cameraGranted) Toast.makeText(this, "Camera परवानगी नाकारली आहे; camera सुविधा बंद राहील.", Toast.LENGTH_LONG).show();
                      } else {
                          Toast.makeText(this, "Location परवानगी नाकारली आहे; GPS tracking सुरू होणार नाही.", Toast.LENGTH_LONG).show();
                      }
                  }
              }

