name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Native Android Project
        run: |
          mkdir -p app/src/main/java/com/childsafety/tracker
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "ChildSafetyApp"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.childsafety.tracker'
              compileSdk 34

              defaultConfig {
                  applicationId "com.childsafety.tracker"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // बाहेरील कोणत्याही अवजड लायब्ररीची गरज नाही
          }
          EOF

          # 4. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Child Safety</string>
          </resources>
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LocationService"
                      android:foregroundServiceType="location"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 6. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/MainActivity.java
          package com.childsafety.tracker;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 100, 50, 50);

                  final TextView statusText = new TextView(this);
                  statusText.setText("Child Safety Service: बंद आहे");
                  statusText.setTextSize(18f);

                  Button btnStart = new Button(this);
                  btnStart.setText("सुरक्षा व ट्रॅकिंग सुरू करा");
                  btnStart.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 101);
                      }
                      Intent intent = new Intent(MainActivity.this, LocationService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent);
                      } else {
                          startService(intent);
                      }
                      statusText.setText("Child Safety Service: सक्रिय (Active) आहे!");
                  });

                  layout.addView(statusText);
                  layout.addView(btnStart);
                  setContentView(layout);
              }
          }
          EOF

          # 7. LocationService.java
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/LocationService.java
          package com.childsafety.tracker;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;

          public class LocationService extends Service implements LocationListener {
              private LocationManager locationManager;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startForegroundNotification();
                  setupLocationTracking();
              }

              private void startForegroundNotification() {
                  String channelId = "child_safety_channel";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          channelId, "Protection Active", NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);

                      Notification notification = new Notification.Builder(this, channelId)
                          .setContentTitle("सुरक्षा सेवा सुरू आहे")
                          .setContentText("लाईव्ह ट्रॅकिंग सक्रिय आहे.")
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .build();
                      startForeground(1001, notification);
                  }
              }

              private void setupLocationTracking() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  try {
                      if (locationManager != null) {
                          locationManager.requestLocationUpdates(
                              LocationManager.GPS_PROVIDER, 5000, 5f, this
                          );
                      }
                  } catch (SecurityException e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  // मुलाचे लाईव्ह लोकेशन इथे मिळते
              }

              @Override
              public void onStatusChanged(String provider, int status, Bundle extras) {}
              @Override
              public void onProviderEnabled(String provider) {}
              @Override
              public void onProviderDisabled(String provider) {}

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (locationManager != null) locationManager.removeUpdates(this);
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSafety-Testing-APK
          path: app/build/outputs/apk/debug/*.apk
