          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/LocationService.java
          package com.childsafety.tracker;

          import android.app.*;
          import android.Manifest;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.location.*;
          import android.hardware.Camera;
          import android.graphics.SurfaceTexture;
          import android.graphics.YuvImage;
          import android.graphics.Rect;
          import android.graphics.ImageFormat;
          import android.util.Base64;
          import android.content.pm.ServiceInfo;
          import android.app.usage.UsageStats;
          import android.app.usage.UsageStatsManager;
          import android.app.AppOpsManager;
          import android.os.*;
          import java.net.URI;
          import org.java_websocket.client.WebSocketClient;
          import org.java_websocket.handshake.ServerHandshake;
          import org.json.JSONObject;

          public class LocationService extends Service implements LocationListener {
              private LocationManager locationManager;
              private SharedPreferences prefs;
              private WebSocketClient wsClient;
              private Location lastLocation = null;
              private long stopStartTime = 0;
              private long lastUsageReport = 0;
              private Camera captureCamera;
              private SurfaceTexture captureTexture;
              private volatile boolean captureInProgress = false;
              private final String SERVER_WS = "wss://family-safety-server-yqco.onrender.com";

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("FamilyTrackerPrefs", Context.MODE_PRIVATE);
                  startForegroundNotification();
                  connectWebSocket();
                  setupLocationTracking();
              }

              private void startForegroundNotification() {
                  String channelId = "child_safety_channel";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(channelId, "Protection Active", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager mgr = getSystemService(NotificationManager.class);
                      if (mgr != null) mgr.createNotificationChannel(ch);

                      int childNum = prefs.getInt("child_number", 1);
                      Notification notif = new Notification.Builder(this, channelId)
                          .setContentTitle("सुरक्षा सेवा सुरू आहे")
                          .setContentText("मुलगा " + childNum + " चे लाईव्ह ट्रॅकिंग सक्रिय आहे.")
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .build();
                      int serviceTypes = ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                      if (Build.VERSION.SDK_INT >= 34 && prefs.getBoolean("camera_session_enabled", false)
                          && prefs.getBoolean("camera_permission_granted", false)) {
                          serviceTypes |= ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA;
                      }
                      if (Build.VERSION.SDK_INT >= 29) startForeground(1001, notif, serviceTypes);
                      else startForeground(1001, notif);
                  }
              }

              private void connectWebSocket() {
                  try {
                      wsClient = new WebSocketClient(new URI(SERVER_WS)) {
                          @Override
                          public void onOpen(ServerHandshake handshakedata) {
                              try {
                                  JSONObject reg = new JSONObject();
                                  reg.put("type", "register");
                                  reg.put("familyCode", prefs.getString("family_code", "family"));
                                  reg.put("role", "CHILD");
                                  reg.put("childId", String.valueOf(prefs.getInt("child_number", 1)));
                                  send(reg.toString());
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onMessage(String message) {
                              try {
                                  JSONObject msg = new JSONObject(message);
                                  if (msg.has("command")) {
                                      String cmd = msg.getString("command");
                                      if (cmd.equals("BLOCK_GAMES")) {
                                          prefs.edit().putBoolean("block_games", true).apply();
                                          sendChildStatus("Remote App Blocking आदेश मिळाला; Accessibility service सक्रिय असल्यास निवडलेल्या ॲप्सवर लागू होईल.");
                                      } else if (cmd.equals("UNBLOCK_GAMES")) {
                                          prefs.edit().putBoolean("block_games", false).apply();
                                          sendChildStatus("Remote App Blocking बंद केला.");
                                      } else if (cmd.equals("CAMERA_CAPTURE")) {
                                          if (prefs.getBoolean("camera_session_enabled", false) && prefs.getBoolean("camera_permission_granted", false)) captureAndSendPhoto();
                                          else sendChildStatus("कॅमेरा सत्र मुलाच्या फोनवर सुरू केलेले नाही किंवा Camera permission उपलब्ध नाही.");
                                      } else if (cmd.equals("CAMERA_START")) {
                                          if (prefs.getBoolean("camera_session_enabled", false) && prefs.getBoolean("camera_permission_granted", false)) startCameraStream();
                                          else sendChildStatus("मुलाच्या फोनवर Camera session सुरू करून संमती द्या.");
                                      } else if (cmd.equals("CAMERA_STOP")) {
                                          releaseCaptureCamera();
                                          sendChildStatus("Camera stream बंद केला.");
                                      } else if (cmd.equals("SET_GEOFENCE")) {
                                          double la = msg.optDouble("latitude", 0);
                                          double lo = msg.optDouble("longitude", 0);
                                          int radius = msg.optInt("radius", 500);
                                          if (la >= -90 && la <= 90 && lo >= -180 && lo <= 180 && radius >= 50 && radius <= 50000) {
                                              prefs.edit().putLong("safe_lat", Double.doubleToLongBits(la)).putLong("safe_lng", Double.doubleToLongBits(lo)).putInt("safe_radius", radius).apply();
                                              sendChildStatus("Geofence सेटिंग्ज सेव्ह झाल्या.");
                                          }
                                      }
                                  }
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onClose(int code, String reason, boolean remote) {
                              android.util.Log.w("FamilySafety", "WebSocket closed: " + reason);
                          }
                          @Override
                          public void onError(Exception ex) {
                              android.util.Log.e("FamilySafety", "WebSocket error", ex);
                          }
                      };
                      wsClient.connect();
                  } catch (Exception e) {}
              }

              private void sendChildStatus(String message) {
                  try { if (wsClient != null && wsClient.isOpen()) { JSONObject payload = new JSONObject(); payload.put("featureStatus", message); JSONObject packet = new JSONObject(); packet.put("type", "signal"); packet.put("payload", payload.toString()); wsClient.send(packet.toString()); } } catch (Exception ignored) {}
              }

              // Low-frame-rate JPEG preview over the existing authenticated-family WebSocket.
              // This is a consent-gated preview, not a covert camera mechanism.
              private void startCameraStream() {
                  if (captureCamera != null) { sendChildStatus("Camera stream आधीच सुरू आहे."); return; }
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      sendChildStatus("Camera permission नाही; live preview सुरू केला नाही."); return;
                  }
                  new Thread(() -> {
                      try {
                          int cameraId = 0, count = Camera.getNumberOfCameras(); boolean found = false;
                          for (int i=0; i<count; i++) { Camera.CameraInfo info = new Camera.CameraInfo(); Camera.getCameraInfo(i, info); if (info.facing == Camera.CameraInfo.CAMERA_FACING_BACK) { cameraId=i; found=true; break; } }
                          if (!found && count == 0) throw new IllegalStateException("No camera");
                          captureCamera = Camera.open(cameraId);
                          Camera.Parameters params = captureCamera.getParameters();
                          java.util.List<Camera.Size> sizes = params.getSupportedPreviewSizes();
                          Camera.Size chosen = null;
                          if (sizes != null) for (Camera.Size size : sizes) if (size.width <= 640 && size.height <= 480 && (chosen == null || size.width * size.height > chosen.width * chosen.height)) chosen = size;
                          if (chosen != null) params.setPreviewSize(chosen.width, chosen.height);
                          params.setPreviewFormat(ImageFormat.NV21);
                          captureCamera.setParameters(params);
                          final int width = captureCamera.getParameters().getPreviewSize().width;
                          final int height = captureCamera.getParameters().getPreviewSize().height;
                          captureTexture = new SurfaceTexture(10);
                          captureCamera.setPreviewTexture(captureTexture);
                          captureCamera.setPreviewCallback((data, cam) -> {
                              long now = System.currentTimeMillis();
                              if (now - lastVideoFrameAt < 700 || data == null || wsClient == null || !wsClient.isOpen()) return;
                              lastVideoFrameAt = now;
                              try {
                                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                                  YuvImage yuv = new YuvImage(data, ImageFormat.NV21, width, height, null);
                                  if (yuv.compressToJpeg(new Rect(0, 0, width, height), 38, out)) {
                                      JSONObject payload = new JSONObject();
                                      payload.put("cameraImage", Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                                      payload.put("cameraCapturedAt", now);
                                      JSONObject packet = new JSONObject(); packet.put("type", "signal"); packet.put("payload", payload.toString());
                                      wsClient.send(packet.toString());
                                  }
                                  out.close();
                              } catch (Exception ignored) {}
                          });
                          captureCamera.startPreview();
                          sendChildStatus("Live camera preview सुरू आहे. मुलाच्या फोनवर सुरक्षा सेवा सूचना दिसत राहील.");
                      } catch (Exception e) {
                          releaseCaptureCamera();
                          sendChildStatus("Live camera सुरू करता आला नाही: " + e.getClass().getSimpleName());
                      }
                  }).start();
              }

              // Only used after the child explicitly enables a visibly-notified camera session.
              private void captureAndSendPhoto() {
                  if (captureInProgress) return;
                  if (captureCamera != null) releaseCaptureCamera();
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) { sendChildStatus("Camera permission नाही; फोटो घेतला नाही."); return; }
                  captureInProgress = true;
                  new Thread(() -> {
                      try {
                          int cameraId = 0, count = Camera.getNumberOfCameras(); boolean found = false;
                          for (int i=0; i<count; i++) { Camera.CameraInfo info = new Camera.CameraInfo(); Camera.getCameraInfo(i, info); if (info.facing == Camera.CameraInfo.CAMERA_FACING_BACK) { cameraId=i; found=true; break; } }
                          if (!found && count == 0) throw new IllegalStateException("No camera");
                          captureCamera = Camera.open(cameraId); captureTexture = new SurfaceTexture(10); captureCamera.setPreviewTexture(captureTexture); captureCamera.startPreview();
                          try { Thread.sleep(350); } catch (InterruptedException ignored) {}
                          captureCamera.takePicture(null, null, (data, camera) -> {
                              try { if (wsClient != null && wsClient.isOpen()) { JSONObject payload = new JSONObject(); payload.put("cameraImage", Base64.encodeToString(data, Base64.NO_WRAP)); payload.put("cameraCapturedAt", System.currentTimeMillis()); JSONObject packet = new JSONObject(); packet.put("type", "signal"); packet.put("payload", payload.toString()); wsClient.send(packet.toString()); sendChildStatus("सक्रिय camera session मधून फोटो पालकांना पाठवला."); } }
                              catch (Exception e) { sendChildStatus("फोटो पाठवता आला नाही."); }
                              finally { releaseCaptureCamera(); captureInProgress=false; }
                          });
                      } catch (Exception e) { releaseCaptureCamera(); captureInProgress=false; sendChildStatus("कॅमेरा सुरू करता आला नाही: " + e.getClass().getSimpleName()); }
                  }).start();
              }
              private void releaseCaptureCamera() {
                  try { if (captureCamera != null) { captureCamera.setPreviewCallback(null); captureCamera.stopPreview(); captureCamera.release(); } } catch (Exception ignored) {} captureCamera=null;
                  try { if (captureTexture != null) captureTexture.release(); } catch (Exception ignored) {} captureTexture=null;
              }

              private void setupLocationTracking() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  try {
                      if (locationManager != null) {
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 5000, 5f, this);
                      }
                  } catch (SecurityException e) {}
              }

              @Override
              public void onLocationChanged(Location loc) {
                  double lat = loc.getLatitude();
                  double lng = loc.getLongitude();
                  long now = System.currentTimeMillis();

                  boolean isStop = false;
                  long duration = 0;
                  if (lastLocation != null) {
                      if (lastLocation.distanceTo(loc) < 50) {
                          if (stopStartTime == 0) stopStartTime = now;
                          duration = (now - stopStartTime) / 60000;
                          if (duration >= 3) isStop = true;
                      } else {
                          stopStartTime = 0;
                      }
                  }
                  lastLocation = loc;

                  String alert = "";
                  float[] res = new float[1];
                  double sLat = Double.longBitsToDouble(prefs.getLong("safe_lat", 0));
                  double sLng = Double.longBitsToDouble(prefs.getLong("safe_lng", 0));
                  if (sLat != 0 && sLng != 0) {
                      Location.distanceBetween(lat, lng, sLat, sLng, res);
                      if (res[0] > prefs.getInt("safe_radius", 500)) alert = "ALERT: मुलगा सुरक्षित क्षेत्राबाहेर गेला आहे! अंतर: " + Math.round(res[0]) + "m";
                  }

                  if (wsClient != null && wsClient.isOpen()) {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("lat", lat);
                          payload.put("lng", lng);
                          payload.put("time", now);
                          payload.put("isStop", isStop);
                          payload.put("duration", duration);
                          payload.put("alert", alert);
                          if (now - lastUsageReport >= 60000) {
                              String usage = buildUsageSummary(now);
                              if (!usage.isEmpty()) { payload.put("usageSummary", usage); lastUsageReport = now; }
                          }

                          JSONObject packet = new JSONObject();
                          packet.put("type", "signal");
                          packet.put("payload", payload.toString());
                          wsClient.send(packet.toString());
                      } catch (Exception e) {}
                  }
              }

              private String buildUsageSummary(long now) {
                  try {
                      AppOpsManager ops = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                      int mode = ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), getPackageName());
                      if (mode != AppOpsManager.MODE_ALLOWED) return "";
                      UsageStatsManager manager = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                      if (manager == null) return "";
                      java.util.Map<String, UsageStats> stats = manager.queryAndAggregateUsageStats(now - 24L * 60L * 60L * 1000L, now);
                      java.util.ArrayList<UsageStats> list = new java.util.ArrayList<>(stats.values());
                      java.util.Collections.sort(list, (a, b) -> Long.compare(b.getTotalTimeInForeground(), a.getTotalTimeInForeground()));
                      StringBuilder out = new StringBuilder("मागील 24 तासांचे App Usage (परवानगी दिल्यास):\n");
                      int count = 0;
                      for (UsageStats u : list) {
                          if (u.getTotalTimeInForeground() < 60000 || getPackageName().equals(u.getPackageName())) continue;
                          if (count++ >= 5) break;
                          out.append(u.getPackageName()).append(": ").append(u.getTotalTimeInForeground() / 60000).append(" मिनिटे\n");
                      }
                      return count == 0 ? "मागील 24 तासांत वापराची नोंद उपलब्ध नाही." : out.toString();
                  } catch (Exception e) { return ""; }
              }

              @Override
              public void onStatusChanged(String p, int s, Bundle b) {}
              @Override
              public void onProviderEnabled(String p) {}
              @Override
              public void onProviderDisabled(String p) {}

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (locationManager != null) locationManager.removeUpdates(this);
                  if (wsClient != null) wsClient.close();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

