name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Complete Private Child Safety App
        run: |
          mkdir -p app/src/main/java/com/childsafety/tracker
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "ChildSafetyApp"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.childsafety.tracker'
              compileSdk 34

              defaultConfig {
                  applicationId "com.childsafety.tracker"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'org.java-websocket:Java-WebSocket:1.5.6'
          }
          EOF

          # 4. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Family Safety Pro (Private)</string>
              <string name="accessibility_desc">Child Safety App Lock Protection</string>
          </resources>
          EOF

          # 5. Accessibility Config XML
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LocationService"
                      android:foregroundServiceType="location"
                      android:exported="false" />

                  <service
                      android:name=".SafetyAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. SafetyAccessibilityService.java (App Blocking)
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/SafetyAccessibilityService.java
          package com.childsafety.tracker;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;

          public class SafetyAccessibilityService extends AccessibilityService {
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      CharSequence pkg = event.getPackageName();
                      if (pkg == null) return;

                      SharedPreferences prefs = getSharedPreferences("FamilyTrackerPrefs", Context.MODE_PRIVATE);
                      boolean isBlocked = prefs.getBoolean("block_games", false);

                      String pkgName = pkg.toString().toLowerCase();
                      if (isBlocked && (pkgName.contains("youtube") || pkgName.contains("freefire") || pkgName.contains("pubg") || pkgName.contains("instagram"))) {
                          performGlobalAction(GLOBAL_ACTION_HOME);
                          Toast.makeText(this, "पालकांनी हे ॲप ब्लॉक केले आहे!", Toast.LENGTH_LONG).show();
                      }
                  }
              }
              @Override
              public void onInterrupt() {}
          }
          EOF

          # 8. LocationService.java (Live GPS, Stops, Geofencing & Private Server Sync)
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/LocationService.java
          package com.childsafety.tracker;

          import android.app.*;
          import android.content.*;
          import android.location.*;
          import android.os.*;
          import java.net.URI;
          import org.java_websocket.client.WebSocketClient;
          import org.java_websocket.handshake.ServerHandshake;
          import org.json.JSONObject;

          public class LocationService extends Service implements LocationListener {
              private LocationManager locationManager;
              private SharedPreferences prefs;
              private WebSocketClient wsClient;
              private Location lastLocation = null;
              private long stopStartTime = 0;
              private final String SERVER_WS = "wss://family-safety-server-yqco.onrender.com";

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("FamilyTrackerPrefs", Context.MODE_PRIVATE);
                  startForegroundNotification();
                  connectWebSocket();
                  setupLocationTracking();
              }

              private void startForegroundNotification() {
                  String channelId = "child_safety_channel";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(channelId, "Protection Active", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager mgr = getSystemService(NotificationManager.class);
                      if (mgr != null) mgr.createNotificationChannel(ch);

                      int childNum = prefs.getInt("child_number", 1);
                      Notification notif = new Notification.Builder(this, channelId)
                          .setContentTitle("सुरक्षा सेवा सुरू आहे")
                          .setContentText("मुलगा " + childNum + " चे लाईव्ह ट्रॅकिंग सक्रिय आहे.")
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .build();
                      startForeground(1001, notif);
                  }
              }

              private void connectWebSocket() {
                  try {
                      wsClient = new WebSocketClient(new URI(SERVER_WS)) {
                          @Override
                          public void onOpen(ServerHandshake handshakedata) {
                              try {
                                  JSONObject reg = new JSONObject();
                                  reg.put("type", "register");
                                  reg.put("familyCode", prefs.getString("family_code", "family"));
                                  reg.put("role", "CHILD");
                                  reg.put("childId", String.valueOf(prefs.getInt("child_number", 1)));
                                  send(reg.toString());
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onMessage(String message) {
                              try {
                                  JSONObject msg = new JSONObject(message);
                                  if (msg.has("command")) {
                                      String cmd = msg.getString("command");
                                      if (cmd.equals("BLOCK_GAMES")) {
                                          prefs.edit().putBoolean("block_games", true).apply();
                                      } else if (cmd.equals("UNBLOCK_GAMES")) {
                                          prefs.edit().putBoolean("block_games", false).apply();
                                      }
                                  }
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onClose(int code, String reason, boolean remote) {}
                          @Override
                          public void onError(Exception ex) {}
                      };
                      wsClient.connect();
                  } catch (Exception e) {}
              }

              private void setupLocationTracking() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  try {
                      if (locationManager != null) {
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 5000, 5f, this);
                      }
                  } catch (SecurityException e) {}
              }

              @Override
              public void onLocationChanged(Location loc) {
                  double lat = loc.getLatitude();
                  double lng = loc.getLongitude();
                  long now = System.currentTimeMillis();

                  boolean isStop = false;
                  long duration = 0;
                  if (lastLocation != null) {
                      if (lastLocation.distanceTo(loc) < 50) {
                          if (stopStartTime == 0) stopStartTime = now;
                          duration = (now - stopStartTime) / 60000;
                          if (duration >= 3) isStop = true;
                      } else {
                          stopStartTime = 0;
                      }
                  }
                  lastLocation = loc;

                  String alert = "";
                  float[] res = new float[1];
                  double sLat = Double.longBitsToDouble(prefs.getLong("safe_lat", 0));
                  double sLng = Double.longBitsToDouble(prefs.getLong("safe_lng", 0));
                  if (sLat != 0 && sLng != 0) {
                      Location.distanceBetween(lat, lng, sLat, sLng, res);
                      if (res[0] > 500) alert = "ALERT: मुलगा सुरक्षित क्षेत्राबाहेर गेला आहे!";
                  }

                  if (wsClient != null && wsClient.isOpen()) {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("lat", lat);
                          payload.put("lng", lng);
                          payload.put("time", now);
                          payload.put("isStop", isStop);
                          payload.put("duration", duration);
                          payload.put("alert", alert);

                          JSONObject packet = new JSONObject();
                          packet.put("type", "signal");
                          packet.put("payload", payload.toString());
                          wsClient.send(packet.toString());
                      } catch (Exception e) {}
                  }
              }

              @Override
              public void onStatusChanged(String p, int s, Bundle b) {}
              @Override
              public void onProviderEnabled(String p) {}
              @Override
              public void onProviderDisabled(String p) {}

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (locationManager != null) locationManager.removeUpdates(this);
                  if (wsClient != null) wsClient.close();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # 9. MainActivity.java (Complete Dashboard: Live Map, Camera, Save to Phone Gallery & Audio)
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/MainActivity.java
          package com.childsafety.tracker;

          import android.Manifest;
          import android.app.Activity;
          import android.content.*;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.hardware.Camera;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.WebView;
          import android.widget.*;
          import java.io.*;
          import java.net.URI;
          import java.util.ArrayList;
          import org.java_websocket.client.WebSocketClient;
          import org.java_websocket.handshake.ServerHandshake;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private SharedPreferences prefs;
              private WebSocketClient wsClient;
              private String selectedChild = "1";
              private double currentLat = 0, currentLng = 0;
              private WebView mapWebView;
              private TextView statusText, alertText;
              private ImageView cameraFeedView;
              private Bitmap latestCameraBitmap = null;
              private ArrayList<String> routePoints = new ArrayList<>();
              private final String SERVER_WS = "wss://family-safety-server-yqco.onrender.com";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("FamilyTrackerPrefs", Context.MODE_PRIVATE);

                  String role = prefs.getString("user_role", "");
                  if (role.equals("PARENT")) {
                      showParentDashboard();
                  } else if (role.equals("CHILD")) {
                      showChildScreen();
                  } else {
                      showRoleSelectionScreen();
                  }
              }

              private void showRoleSelectionScreen() {
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 80, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("Family Safety 360 Pro\n(खाजगी सर्व्हर आवृत्ती)");
                  title.setTextSize(22f);
                  title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  layout.addView(title);

                  TextView lblCode = new TextView(this);
                  lblCode.setText("\nFamily Secret Code (कुटुंबाचा गुप्त पासवर्ड):");
                  layout.addView(lblCode);

                  final EditText edtCode = new EditText(this);
                  edtCode.setHint("उदा. katekar123");
                  edtCode.setText(prefs.getString("family_code", ""));
                  layout.addView(edtCode);

                  Button btnParent = new Button(this);
                  btnParent.setText("👨‍👩‍👧‍👦 मी पालक आहे (मुलांवर लक्ष ठेवा)");
                  btnParent.setOnClickListener(v -> {
                      String code = edtCode.getText().toString().trim();
                      if (code.isEmpty()) { Toast.makeText(this, "कृपया कोड टाका!", Toast.LENGTH_SHORT).show(); return; }
                      prefs.edit().putString("family_code", code).putString("user_role", "PARENT").apply();
                      showParentDashboard();
                  });
                  layout.addView(btnParent);

                  Button btnChild = new Button(this);
                  btnChild.setText("👦 हा मुलाचा फोन आहे (सुरक्षा सुरू करा)");
                  btnChild.setOnClickListener(v -> {
                      String code = edtCode.getText().toString().trim();
                      if (code.isEmpty()) { Toast.makeText(this, "कृपया कोड टाका!", Toast.LENGTH_SHORT).show(); return; }
                      prefs.edit().putString("family_code", code).putString("user_role", "CHILD").apply();
                      showChildScreen();
                  });
                  layout.addView(btnChild);

                  setContentView(layout);
              }

              private void showChildScreen() {
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 60, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("मुलाचा फोन सेटअप");
                  title.setTextSize(20f);
                  layout.addView(title);

                  String[] kids = {"मुलगा १ (Child 1)", "मुलगा २ (Child 2)", "मुलगा ३ (Child 3)"};
                  final Spinner spinner = new Spinner(this);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, kids);
                  spinner.setAdapter(adapter);
                  spinner.setSelection(prefs.getInt("child_number", 1) - 1);
                  layout.addView(spinner);

                  Button btnStart = new Button(this);
                  btnStart.setText("१. सुरक्षा व GPS ट्रॅकिंग सुरू करा");
                  btnStart.setOnClickListener(v -> {
                      int childNum = spinner.getSelectedItemPosition() + 1;
                      prefs.edit().putInt("child_number", childNum).apply();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          }, 101);
                      }
                      Intent intent = new Intent(this, LocationService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent);
                      } else {
                          startService(intent);
                      }
                      Toast.makeText(this, "ट्रॅकिंग सुरू झाले!", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(btnStart);

                  Button btnAppBlock = new Button(this);
                  btnAppBlock.setText("२. ॲप ब्लॉकर परमिशन (Accessibility) द्या");
                  btnAppBlock.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                      Toast.makeText(this, "यादीतून 'Family Safety Pro' निवडून ON करा", Toast.LENGTH_LONG).show();
                  });
                  layout.addView(btnAppBlock);

                  Button btnReset = new Button(this);
                  btnReset.setText("मोड बदला (Change Role)");
                  btnReset.setOnClickListener(v -> {
                      prefs.edit().clear().apply();
                      showRoleSelectionScreen();
                  });
                  layout.addView(btnReset);

                  setContentView(layout);
              }

              private void showParentDashboard() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("पालक नियंत्रण - खाजगी डॅशबोर्ड");
                  title.setTextSize(18f);
                  layout.addView(title);

                  // ३ मुलांचे टॅब बटन्स
                  LinearLayout btnLayout = new LinearLayout(this);
                  btnLayout.setOrientation(LinearLayout.HORIZONTAL);
                  for (int i = 1; i <= 3; i++) {
                      final String id = String.valueOf(i);
                      Button b = new Button(this);
                      b.setText("मुलगा " + id);
                      b.setOnClickListener(v -> {
                          selectedChild = id;
                          routePoints.clear();
                          Toast.makeText(this, "मुलगा " + id + " सिलेक्ट झाला", Toast.LENGTH_SHORT).show();
                      });
                      btnLayout.addView(b);
                  }
                  layout.addView(btnLayout);

                  alertText = new TextView(this);
                  alertText.setTextColor(0xFFFF0000);
                  alertText.setTextSize(16f);
                  layout.addView(alertText);

                  statusText = new TextView(this);
                  statusText.setText("\nखाजगी सर्व्हरशी संपर्क साधत आहे...");
                  layout.addView(statusText);

                  // Live Camera व Save Buttons
                  TextView lblCam = new TextView(this);
                  lblCam.setText("\n📸 थेट कॅमेरा फीड:");
                  layout.addView(lblCam);

                  cameraFeedView = new ImageView(this);
                  cameraFeedView.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 500));
                  cameraFeedView.setBackgroundColor(0xFF222222);
                  layout.addView(cameraFeedView);

                  LinearLayout saveActions = new LinearLayout(this);
                  saveActions.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnSavePic = new Button(this);
                  btnSavePic.setText("💾 फोटो गॅलरीत सेव्ह करा");
                  btnSavePic.setOnClickListener(v -> saveCurrentPhotoToGallery());
                  saveActions.addView(btnSavePic);

                  layout.addView(saveActions);

                  // ॲप ब्लॉकर टॉगल
                  CheckBox chkBlock = new CheckBox(this);
                  chkBlock.setText("गेम्स व सोशल मीडिया ब्लॉक करा (Remote Block)");
                  chkBlock.setOnCheckedChangeListener((btn, isChecked) -> sendCommand(isChecked ? "BLOCK_GAMES" : "UNBLOCK_GAMES"));
                  layout.addView(chkBlock);

                  // Google Maps Button
                  Button btnGmaps = new Button(this);
                  btnGmaps.setText("📍 थेट Google Maps मध्ये उघडा");
                  btnGmaps.setOnClickListener(v -> {
                      if (currentLat != 0 && currentLng != 0) {
                          Intent gmaps = new Intent(Intent.ACTION_VIEW, Uri.parse("geo:" + currentLat + "," + currentLng + "?q=" + currentLat + "," + currentLng + "(Child " + selectedChild + ")"));
                          startActivity(gmaps);
                      }
                  });
                  layout.addView(btnGmaps);

                  mapWebView = new WebView(this);
                  mapWebView.getSettings().setJavaScriptEnabled(true);
                  mapWebView.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 800));
                  layout.addView(mapWebView);

                  Button btnReset = new Button(this);
                  btnReset.setText("मोड बदला (Change Role)");
                  btnReset.setOnClickListener(v -> {
                      prefs.edit().clear().apply();
                      showRoleSelectionScreen();
                  });
                  layout.addView(btnReset);

                  scroll.addView(layout);
                  setContentView(scroll);
                  connectParentWebSocket();
              }

              private void connectParentWebSocket() {
                  try {
                      wsClient = new WebSocketClient(new URI(SERVER_WS)) {
                          @Override
                          public void onOpen(ServerHandshake handshakedata) {
                              try {
                                  JSONObject reg = new JSONObject();
                                  reg.put("type", "register");
                                  reg.put("familyCode", prefs.getString("family_code", "family"));
                                  reg.put("role", "PARENT");
                                  send(reg.toString());
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onMessage(String message) {
                              try {
                                  JSONObject obj = new JSONObject(message);
                                  if (obj.has("data")) {
                                      String payloadStr = obj.getString("data");
                                      JSONObject data = new JSONObject(payloadStr);

                                      if (data.has("lat")) {
                                          currentLat = data.getDouble("lat");
                                          currentLng = data.getDouble("lng");
                                          boolean isStop = data.optBoolean("isStop", false);
                                          long dur = data.optLong("duration", 0);
                                          String alert = data.optString("alert", "");

                                          routePoints.add("[" + currentLat + "," + currentLng + "]");

                                          runOnUiThread(() -> {
                                              statusText.setText("👦 मुलगा " + selectedChild + " चे लोकेशन:\nअक्षांश: " + currentLat + ", रेखांश: " + currentLng + (isStop ? "\n🛑 थांबा: " + dur + " मिनिटे" : ""));
                                              if (!alert.isEmpty()) alertText.setText("🚨 " + alert);
                                              loadMapWithRoute(currentLat, currentLng, isStop, dur);
                                          });
                                      }

                                      if (data.has("cameraImage")) {
                                          byte[] decoded = Base64.decode(data.getString("cameraImage"), Base64.DEFAULT);
                                          latestCameraBitmap = BitmapFactory.decodeByteArray(decoded, 0, decoded.length);
                                          runOnUiThread(() -> cameraFeedView.setImageBitmap(latestCameraBitmap));
                                      }
                                  }
                              } catch (Exception e) {}
                          }

                          @Override
                          public void onClose(int code, String reason, boolean remote) {}
                          @Override
                          public void onError(Exception ex) {}
                      };
                      wsClient.connect();
                  } catch (Exception e) {}
              }

              private void sendCommand(String cmd) {
                  if (wsClient != null && wsClient.isOpen()) {
                      try {
                          JSONObject c = new JSONObject();
                          c.put("type", "command");
                          c.put("targetChildId", selectedChild);
                          c.put("command", cmd);
                          wsClient.send(c.toString());
                          Toast.makeText(this, "आदेश पाठवला!", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {}
                  }
              }

              private void saveCurrentPhotoToGallery() {
                  if (latestCameraBitmap == null) {
                      Toast.makeText(this, "अजून कोणताही कॅमेरा फोटो आलेला नाही!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      String title = "Child_" + selectedChild + "_" + System.currentTimeMillis();
                      MediaStore.Images.Media.insertImage(getContentResolver(), latestCameraBitmap, title, "Family Safety Capture");
                      Toast.makeText(this, "फोटो तुमच्या मोबाईलच्या गॅलरीत सेव्ह झाला!", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "फोटो सेव्ह करताना अडचण आली!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void loadMapWithRoute(double lat, double lng, boolean isStop, long duration) {
                  StringBuilder poly = new StringBuilder("[");
                  for (int i = 0; i < routePoints.size(); i++) {
                      poly.append(routePoints.get(i));
                      if (i < routePoints.size() - 1) poly.append(",");
                  }
                  poly.append("]");

                  String stopMarker = isStop ? "L.circleMarker([" + lat + "," + lng + "], {color: 'red', radius: 12}).addTo(map).bindPopup('🛑 थांबा: " + duration + " मिनिटे').openPopup();" : "";
                  String html = "<html><head><link rel='stylesheet' href='https://unpkg.com/leaflet/dist/leaflet.css'/><script src='https://unpkg.com/leaflet/dist/leaflet.js'></script></head><body style='margin:0;padding:0;'><div id='map' style='width:100%;height:100vh;'></div><script>var map=L.map('map').setView([" + lat + "," + lng + "],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);var path = " + poly.toString() + "; if(path.length > 1) { L.polyline(path, {color: 'blue', weight: 5}).addTo(map); } L.marker([" + lat + "," + lng + "]).addTo(map).bindPopup('मुलगा " + selectedChild + "').openPopup();" + stopMarker + "</script></body></html>";
                  mapWebView.loadData(html, "text/html", "UTF-8");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (wsClient != null) wsClient.close();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilySafety360-Master-Private-APK
          path: app/build/outputs/apk/debug/*.apk
