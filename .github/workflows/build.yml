name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Clean Android Project
        run: |
          mkdir -p app/src/main/java/com/childsafety/tracker

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "ChildSafetyApp"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.childsafety.tracker'
              compileSdk 34

              defaultConfig {
                  applicationId "com.childsafety.tracker"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.android.gms:play-services-location:21.1.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Child Safety"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LocationService"
                      android:foregroundServiceType="location"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 5. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/MainActivity.kt
          package com.childsafety.tracker

          import android.Manifest
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = android.widget.LinearLayout(this).apply {
                      orientation = android.widget.LinearLayout.VERTICAL
                      setPadding(50, 100, 50, 50)
                  }

                  val statusText = TextView(this).apply {
                      text = "Child Safety Service: बंद आहे"
                      textSize = 18f
                  }

                  val btnStart = Button(this).apply {
                      text = "सुरक्षा व ट्रॅकिंग सुरू करा"
                      setOnClickListener {
                          checkPermissionsAndStart()
                          statusText.text = "Child Safety Service: सक्रिय (Active) आहे!"
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(btnStart)
                  setContentView(layout)
              }

              private fun checkPermissionsAndStart() {
                  val permissions = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  ActivityCompat.requestPermissions(this, permissions.toTypedArray(), 101)

                  val intent = Intent(this, LocationService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }
          }
          EOF

          # 6. LocationService.kt
          cat << 'EOF' > app/src/main/java/com/childsafety/tracker/LocationService.kt
          package com.childsafety.tracker

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import com.google.android.gms.location.*

          class LocationService : Service() {

              private lateinit var fusedLocationClient: FusedLocationProviderClient
              private lateinit var locationCallback: LocationCallback

              override fun onCreate() {
                  super.onCreate()
                  fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)
                  startForegroundNotification()
                  setupTracking()
              }

              private fun startForegroundNotification() {
                  val channelId = "child_safety_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Protection Active",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("सुरक्षा सेवा सुरू आहे")
                      .setContentText("लाईव्ह ट्रॅकिंग सक्रिय आहे.")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
              }

              @SuppressLint("MissingPermission")
              private fun setupTracking() {
                  val locationRequest = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 10000).build()

                  locationCallback = object : LocationCallback() {
                      override fun onLocationResult(result: LocationResult) {
                          for (location in result.locations) {
                              // Location received
                          }
                      }
                  }

                  fusedLocationClient.requestLocationUpdates(locationRequest, locationCallback, Looper.getMainLooper())
              }

              override fun onDestroy() {
                  super.onDestroy()
                  fusedLocationClient.removeLocationUpdates(locationCallback)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSafety-Testing-APK
          path: app/build/outputs/apk/debug/*.apk
